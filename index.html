<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stroke Unit Fall Monitor</title>

<style>
body {
    margin: 0;
    background: black;
    font-family: Arial, sans-serif;
    color: white;
}

h1 {
    text-align: center;
    padding: 20px;
    font-size: 40px;
    margin: 0;
}

.title-bar {
    position: relative;
}

.current-count {
    position: absolute;
    top: 24px;
    right: 28px;
    font-size: 22px;
    background: #1f1f1f;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    padding: 10px 14px;
    color: #6fd3ff;
}

.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 0 20px 10px;
}

.show-discharged-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #cccccc;
    font-size: 15px;
}

.history-search {
    width: 280px;
    max-width: 100%;
    background: #151515;
    color: #fff;
    border: 1px solid #555;
    border-radius: 6px;
    padding: 7px 10px;
}

.header,
.row {
    display: grid;
    grid-template-columns: 2fr 1.2fr 1.4fr 1.1fr 1.3fr 1fr 1fr;
    padding: 15px;
    align-items: center;
    column-gap: 12px;
}

.header {
    background: #222;
    font-size: 22px;
    font-weight: bold;
}

.row {
    border-bottom: 1px solid #333;
    font-size: 20px;
}

.row:nth-child(even) {
    background: #111;
}

.mental-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 17px;
}

.mental-toggle input {
    width: 20px;
    height: 20px;
    cursor: pointer;
}

.score-note {
    font-size: 14px;
    color: #9ec0ff;
    margin-top: 4px;
}

.current-bed-select {
    width: 100%;
    max-width: 140px;
    font-size: 15px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid #666;
    background: #151515;
    color: white;
}

.discharge-btn,
.restore-btn {
    font-size: 14px;
    padding: 7px 10px;
    border: 1px solid #666;
    border-radius: 6px;
    cursor: pointer;
}

.discharge-btn {
    background: #2a2a2a;
    color: #ffb3b3;
}

.discharge-btn:hover {
    background: #402424;
}

.discharged-history {
    margin: 16px 20px 24px;
    border: 1px solid #2f2f2f;
    border-radius: 8px;
    overflow: hidden;
}

.history-title {
    padding: 10px 14px;
    font-size: 16px;
    font-weight: bold;
    background: #1e1e1e;
    color: #e6e6e6;
}

.history-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1.4fr 1fr;
    gap: 12px;
    align-items: center;
    padding: 10px 14px;
    border-top: 1px solid #2a2a2a;
    font-size: 14px;
}

.history-row:nth-child(even) {
    background: #0f0f0f;
}

.restore-btn {
    background: #203223;
    color: #9cffad;
}

.restore-btn:hover {
    background: #2a4a30;
}

.empty-history {
    padding: 12px 14px;
    color: #a5a5a5;
    font-size: 14px;
}

.low { color: lime; }
.moderate { color: orange; }
.high { color: red; }

.dot {
    font-size: 22px;
}
</style>
</head>

<body>

<div class="title-bar">
    <h1>Stroke Unit Fall Monitor</h1>
    <div id="currentCount" class="current-count">จำนวนคนปัจจุบัน: 0</div>
</div>

<div class="toolbar">
    <label class="show-discharged-toggle">
        <input id="showDischarged" type="checkbox">
        แสดงผู้ป่วยกลับบ้านแล้ว
    </label>
    <input id="historySearch" class="history-search" type="text" placeholder="ค้นหาคนไข้ที่กลับบ้านแล้ว...">
</div>

<div class="header">
    <div>ชื่อ</div>
    <div>เตียงแรกรับ</div>
    <div>เตียงปัจจุบัน</div>
    <div>Fall Score</div>
    <div>สับสนวุ่นวาย (+15)</div>
    <div>Risk</div>
    <div>จำหน่าย</div>
</div>

<div id="data"></div>

<div class="discharged-history">
    <div class="history-title">รายการกลับบ้านล่าสุด (กู้กลับได้)</div>
    <div id="dischargedHistory"></div>
</div>

<script>
const sheetURL = "https://opensheet.elk.sh/1dc_L7he2jDu64q8OBGbCEnf2gcrJ16nn7-NiwvbOXW4/dashboard";
const MENTAL_SCORE_BONUS = 15;
const CONFUSION_STORAGE_KEY = "fallMonitorConfusionByPatient";
const CURRENT_BED_STORAGE_KEY = "fallMonitorCurrentBedByPatient";
const DISCHARGED_STORAGE_KEY = "fallMonitorDischargedByPatient";
const SHOW_DISCHARGED_STORAGE_KEY = "fallMonitorShowDischarged";
const DISCHARGED_HISTORY_SEARCH_KEY = "fallMonitorDischargedSearch";
const HISTORY_LIMIT = 200;

let latestRows = [];
let patientMap = {};
const confusionMap = loadMap(CONFUSION_STORAGE_KEY);
const currentBedMap = loadMap(CURRENT_BED_STORAGE_KEY);
const dischargedMap = loadMap(DISCHARGED_STORAGE_KEY);
let showDischarged = loadBoolean(SHOW_DISCHARGED_STORAGE_KEY, false);
let historySearch = loadString(DISCHARGED_HISTORY_SEARCH_KEY, "").trim().toLowerCase();

normalizeDischargedMap();

function loadMap(storageKey) {
    try {
        const raw = localStorage.getItem(storageKey);
        return raw ? JSON.parse(raw) : {};
    } catch (error) {
        return {};
    }
}

function loadBoolean(storageKey, fallbackValue) {
    try {
        const raw = localStorage.getItem(storageKey);
        if (raw === null) return fallbackValue;
        return raw === "true";
    } catch (error) {
        return fallbackValue;
    }
}

function loadString(storageKey, fallbackValue) {
    try {
        const raw = localStorage.getItem(storageKey);
        return raw === null ? fallbackValue : raw;
    } catch (error) {
        return fallbackValue;
    }
}

function saveMap(storageKey, payload) {
    localStorage.setItem(storageKey, JSON.stringify(payload));
}

function saveBoolean(storageKey, value) {
    localStorage.setItem(storageKey, value ? "true" : "false");
}

function saveString(storageKey, value) {
    localStorage.setItem(storageKey, value);
}

function getPatientKey(row) {
    return `${row.Bed || "-"}|${row.Name || "-"}`;
}

function getPatientInfoFromKey(patientKey) {
    const [initialBed = "-", ...nameParts] = String(patientKey).split("|");
    return {
        name: nameParts.join("|") || "-",
        initialBed: initialBed || "-"
    };
}

function parseScore(value) {
    const parsed = Number(value);
    return Number.isFinite(parsed) ? parsed : 0;
}

function getRiskFromScore(score, fallbackRisk) {
    if (Number.isFinite(score)) {
        if (score >= 45) return { label: "High", className: "high" };
        if (score >= 25) return { label: "Moderate", className: "moderate" };
        return { label: "Low", className: "low" };
    }

    const fallback = (fallbackRisk || "Low").toLowerCase();
    if (fallback === "high") return { label: "High", className: "high" };
    if (fallback === "moderate") return { label: "Moderate", className: "moderate" };
    return { label: "Low", className: "low" };
}

function getBedOptions(initialBed) {
    const normalizedInitial = (initialBed || "-").toString();
    const options = new Set([normalizedInitial]);

    for (let bedNo = 1; bedNo <= 30; bedNo += 1) {
        options.add(String(bedNo));
    }

    return [...options];
}

function compareCurrentBed(a, b) {
    const aKey = getPatientKey(a);
    const bKey = getPatientKey(b);

    const aInitialBed = (a.Bed || "-").toString();
    const bInitialBed = (b.Bed || "-").toString();
    const aBed = (currentBedMap[aKey] || aInitialBed).toString();
    const bBed = (currentBedMap[bKey] || bInitialBed).toString();

    const aNum = Number(aBed);
    const bNum = Number(bBed);
    const aIsNum = Number.isFinite(aNum);
    const bIsNum = Number.isFinite(bNum);

    if (aIsNum && bIsNum && aNum !== bNum) return aNum - bNum;
    if (aIsNum !== bIsNum) return aIsNum ? -1 : 1;

    const bedCompare = aBed.localeCompare(bBed, "th", { numeric: true, sensitivity: "base" });
    if (bedCompare !== 0) return bedCompare;

    return (a.Name || "").localeCompare(b.Name || "th", { sensitivity: "base" });
}

function normalizeDischargedMap() {
    Object.keys(dischargedMap).forEach((patientKey) => {
        const value = dischargedMap[patientKey];

        if (!value) {
            delete dischargedMap[patientKey];
            return;
        }

        if (value === true) {
            const info = getPatientInfoFromKey(patientKey);
            dischargedMap[patientKey] = {
                name: info.name,
                initialBed: info.initialBed,
                currentBed: currentBedMap[patientKey] || info.initialBed,
                dischargedAt: null
            };
            return;
        }

        if (typeof value === "object") {
            const info = getPatientInfoFromKey(patientKey);
            value.name = value.name || info.name;
            value.initialBed = value.initialBed || info.initialBed;
            value.currentBed = value.currentBed || currentBedMap[patientKey] || value.initialBed;
            value.dischargedAt = value.dischargedAt || null;
            return;
        }

        delete dischargedMap[patientKey];
    });

    saveMap(DISCHARGED_STORAGE_KEY, dischargedMap);
}

function getDischargeEntry(patientKey) {
    const entry = dischargedMap[patientKey];
    if (!entry) return null;

    if (entry === true) {
        const info = getPatientInfoFromKey(patientKey);
        return {
            name: info.name,
            initialBed: info.initialBed,
            currentBed: currentBedMap[patientKey] || info.initialBed,
            dischargedAt: null
        };
    }

    return entry;
}

function markDischarged(patientKey) {
    const row = patientMap[patientKey] || {};
    const info = getPatientInfoFromKey(patientKey);
    const initialBed = (row.Bed || info.initialBed || "-").toString();

    dischargedMap[patientKey] = {
        name: row.Name || info.name,
        initialBed,
        currentBed: (currentBedMap[patientKey] || initialBed).toString(),
        dischargedAt: new Date().toISOString()
    };

    saveMap(DISCHARGED_STORAGE_KEY, dischargedMap);
}

function restorePatient(patientKey) {
    delete dischargedMap[patientKey];
    saveMap(DISCHARGED_STORAGE_KEY, dischargedMap);
}

function formatDischargeDate(iso) {
    if (!iso) return "ไม่ระบุเวลา";
    const date = new Date(iso);
    if (Number.isNaN(date.getTime())) return "ไม่ระบุเวลา";
    return date.toLocaleString("th-TH", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}

function updatePatientMap(rows) {
    patientMap = {};
    rows.forEach((row) => {
        if (!row.Name) return;
        patientMap[getPatientKey(row)] = row;
    });
}

function renderRows(data) {
    const table = document.getElementById("data");
    const countDisplay = document.getElementById("currentCount");

    table.innerHTML = "";
    let currentCount = 0;

    const sortedRows = [...data].sort(compareCurrentBed);

    sortedRows.forEach((row) => {
        if (!row.Name) return;

        const patientKey = getPatientKey(row);
        const dischargeEntry = getDischargeEntry(patientKey);
        const isDischarged = Boolean(dischargeEntry);
        if (!showDischarged && isDischarged) return;

        currentCount += 1;

        const confused = Boolean(confusionMap[patientKey]);

        const baseScore = parseScore(row.FallTotal);
        const adjustedScore = baseScore + (confused ? MENTAL_SCORE_BONUS : 0);
        const risk = getRiskFromScore(adjustedScore, row.Risk);

        const initialBed = (row.Bed || "-").toString();
        const selectedCurrentBed = currentBedMap[patientKey] || initialBed;
        const bedOptionsHtml = getBedOptions(initialBed)
            .map((bed) => `<option value="${bed}" ${bed === selectedCurrentBed ? "selected" : ""}>${bed}</option>`)
            .join("");

        table.innerHTML += `
            <div class="row">
                <div>${row.Name}</div>
                <div>${initialBed}</div>
                <div>
                    <select class="current-bed-select" data-patient-key="${patientKey}" aria-label="เตียงปัจจุบันของ ${row.Name}">
                        ${bedOptionsHtml}
                    </select>
                </div>
                <div>
                    <div>${adjustedScore}</div>
                    <div class="score-note">base ${baseScore}${confused ? ` + ${MENTAL_SCORE_BONUS}` : ""}</div>
                </div>
                <label class="mental-toggle">
                    <input type="checkbox" data-patient-key="${patientKey}" ${confused ? "checked" : ""}>
                    <span>${confused ? "มี" : "ไม่มี"}</span>
                </label>
                <div class="${risk.className}">
                    <span class="dot">●</span> ${risk.label}
                </div>
                <div>
                    <button type="button" class="discharge-btn" data-patient-key="${patientKey}">
                        ${isDischarged ? "กู้กลับ" : "กลับบ้าน"}
                    </button>
                </div>
            </div>
        `;
    });

    countDisplay.textContent = `จำนวนคนปัจจุบัน: ${currentCount}`;
}

function renderDischargedHistory() {
    const historyContainer = document.getElementById("dischargedHistory");

    const entries = Object.entries(dischargedMap)
        .map(([patientKey, entry]) => ({ patientKey, entry: getDischargeEntry(patientKey) }))
        .filter(({ entry }) => Boolean(entry))
        .filter(({ entry }) => {
            if (!historySearch) return true;
            const haystack = `${entry.name} ${entry.initialBed} ${entry.currentBed || ""}`.toLowerCase();
            return haystack.includes(historySearch);
        })
        .sort((a, b) => {
            const aTime = a.entry.dischargedAt ? Date.parse(a.entry.dischargedAt) : 0;
            const bTime = b.entry.dischargedAt ? Date.parse(b.entry.dischargedAt) : 0;
            return bTime - aTime;
        })
        .slice(0, HISTORY_LIMIT);

    if (entries.length === 0) {
        historyContainer.innerHTML = '<div class="empty-history">ไม่พบรายการกลับบ้านที่ค้นหา</div>';
        return;
    }

    historyContainer.innerHTML = entries.map(({ patientKey, entry }) => `
        <div class="history-row">
            <div>${entry.name}</div>
            <div>แรกรับ: ${entry.initialBed}</div>
            <div>ปัจจุบัน: ${entry.currentBed || entry.initialBed}</div>
            <div>${formatDischargeDate(entry.dischargedAt)}</div>
            <div><button type="button" class="restore-btn" data-patient-key="${patientKey}">กู้กลับ</button></div>
        </div>
    `).join("");
}

function renderAll() {
    renderRows(latestRows);
    renderDischargedHistory();
}

function loadData() {
    fetch(sheetURL)
        .then((res) => res.json())
        .then((data) => {
            latestRows = data;
            updatePatientMap(data);
            renderAll();
        });
}

document.getElementById("showDischarged").checked = showDischarged;
document.getElementById("historySearch").value = historySearch;

document.getElementById("showDischarged").addEventListener("change", (event) => {
    showDischarged = event.target.checked;
    saveBoolean(SHOW_DISCHARGED_STORAGE_KEY, showDischarged);
    renderAll();
});

document.getElementById("historySearch").addEventListener("input", (event) => {
    historySearch = event.target.value.trim().toLowerCase();
    saveString(DISCHARGED_HISTORY_SEARCH_KEY, historySearch);
    renderDischargedHistory();
});

document.getElementById("data").addEventListener("change", (event) => {
    const target = event.target;
    if (!(target instanceof HTMLElement)) return;

    const patientKey = target.dataset.patientKey;
    if (!patientKey) return;

    if (target instanceof HTMLInputElement && target.type === "checkbox") {
        confusionMap[patientKey] = target.checked;
        saveMap(CONFUSION_STORAGE_KEY, confusionMap);
        renderRows(latestRows);
        return;
    }

    if (target instanceof HTMLSelectElement && target.classList.contains("current-bed-select")) {
        currentBedMap[patientKey] = target.value;

        const dischargeEntry = getDischargeEntry(patientKey);
        if (dischargeEntry) {
            dischargeEntry.currentBed = target.value;
            dischargedMap[patientKey] = dischargeEntry;
            saveMap(DISCHARGED_STORAGE_KEY, dischargedMap);
        }

        saveMap(CURRENT_BED_STORAGE_KEY, currentBedMap);
        renderAll();
    }
});

document.getElementById("data").addEventListener("click", (event) => {
    const button = event.target.closest(".discharge-btn");
    if (!button) return;

    const patientKey = button.dataset.patientKey;
    if (!patientKey) return;

    const currentlyDischarged = Boolean(getDischargeEntry(patientKey));
    if (currentlyDischarged) {
        restorePatient(patientKey);
    } else {
        markDischarged(patientKey);
    }

    renderAll();
});

document.getElementById("dischargedHistory").addEventListener("click", (event) => {
    const button = event.target.closest(".restore-btn");
    if (!button) return;

    const patientKey = button.dataset.patientKey;
    if (!patientKey) return;

    restorePatient(patientKey);
    renderAll();
});

loadData();
setInterval(loadData, 5000); // refresh ทุก 5 วิ
</script>

</body>
</html>
